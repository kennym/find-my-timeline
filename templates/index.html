<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Timeline</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            height: 100vh;
        }

        #sidebar-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1100;
            width: 42px;
            height: 42px;
            padding: 0;
            font-size: 1.35rem;
            line-height: 1;
            border: 1px solid #405070;
            background: #16213e;
            color: #fff;
        }

        body.sidebar-collapsed #sidebar {
            width: 0;
            padding-left: 0;
            padding-right: 0;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 1.4rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: "📍";
        }

        .section {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
        }

        .section h2 {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .device {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .device:hover {
            background: #0f3460;
        }

        .device.active {
            background: #0f3460;
            border-left: 3px solid #00d9ff;
        }

        .device-icon {
            font-size: 1.5rem;
        }

        .device-info {
            flex: 1;
        }

        .device-name {
            font-weight: 500;
            margin-bottom: 2px;
        }

        .device-meta {
            font-size: 0.8rem;
            color: #888;
        }

        .battery {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.85rem;
            color: #aaa;
        }

        select, input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a2e;
            color: #fff;
            font-size: 0.9rem;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #00d9ff;
            color: #000;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #00b8d9;
        }

        .stats {
            font-size: 0.85rem;
            color: #888;
        }

        .stats span {
            color: #00d9ff;
            font-weight: 500;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: #1a1a2e;
        }

        .popup-content {
            padding: 5px;
        }

        .popup-content h3 {
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .popup-content p {
            margin: 4px 0;
            font-size: 0.85rem;
            color: #aaa;
        }

        .timeline-marker {
            background: #00d9ff;
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .current-marker {
            background: #00ff88;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        #timeline-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 350px;
            max-height: calc(100vh - 40px);
            background: #1a1a2e;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }

        #timeline-panel.visible {
            display: flex;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
        }

        .timeline-header h2 {
            font-size: 1rem;
            color: #fff;
            margin: 0;
        }

        #timeline-close {
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
            line-height: 1;
        }

        #timeline-close:hover {
            color: #fff;
        }

        .timeline-summary {
            padding: 12px 20px;
            background: #16213e;
            font-size: 0.85rem;
            color: #aaa;
            border-bottom: 1px solid #333;
        }

        .timeline-summary span {
            color: #00d9ff;
            font-weight: 500;
        }

        .timeline-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .timeline-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .timeline-item:hover {
            background: #16213e;
        }

        .timeline-item.active {
            background: #0f3460;
            border-left: 3px solid #00d9ff;
        }

        .timeline-item.latest {
            border-left: 3px solid #00ff88;
        }

        .timeline-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00d9ff;
            margin-top: 4px;
            flex-shrink: 0;
        }

        .timeline-item.latest .timeline-dot {
            background: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        .timeline-content {
            flex: 1;
            min-width: 0;
        }

        .timeline-time {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 4px;
        }

        .timeline-details {
            font-size: 0.8rem;
            color: #888;
        }

        .timeline-details span {
            margin-right: 10px;
        }

        .timeline-battery {
            font-size: 0.8rem;
            color: #888;
            white-space: nowrap;
        }

        .device-filter {
            margin-bottom: 12px;
        }

        .device.inactive {
            opacity: 0.62;
        }

        @media (max-width: 700px) {
            body {
                display: block;
                height: auto;
                min-height: 100vh;
            }

            #sidebar {
                width: 100%;
                max-height: 42vh;
                padding: 12px;
                gap: 12px;
            }

            #sidebar h1 {
                font-size: 1.1rem;
            }

            #sidebar .section {
                padding: 10px;
            }

            #sidebar .section:not(:first-of-type) {
                display: block;
            }

            #sidebar-toggle {
                top: 8px;
                left: 8px;
            }

            #sidebar h1 {
                padding-left: 48px;
            }

            body.sidebar-collapsed #sidebar {
                display: none;
            }

            body.sidebar-collapsed #map {
                height: 100vh;
            }

            #devices-list {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
                overflow-y: auto;
            }

            .device {
                margin-bottom: 0;
                min-width: 0;
                padding: 8px;
            }

            .device-icon {
                font-size: 1.2rem;
            }

            .device-name, .device-meta {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            #map {
                height: 58vh;
                min-height: 360px;
            }
        }
    </style>
</head>
<body>
    <button id="sidebar-toggle" type="button" aria-label="Close sidebar" aria-expanded="true" title="Close sidebar">☰</button>
    <div id="sidebar">
        <h1>Find My Timeline</h1>

        <div class="section">
            <h2>Devices</h2>
            <div class="device-filter">
                <label for="device-filter">Show</label>
                <select id="device-filter">
                    <option value="all" selected>All devices</option>
                    <option value="active">Active devices</option>
                    <option value="inactive">Inactive devices</option>
                </select>
            </div>
            <div id="devices-list">
                <p style="color: #666; font-size: 0.9rem;">Loading devices...</p>
            </div>
        </div>

        <div class="section">
            <h2>Date Range</h2>
            <div class="controls">
                <div>
                    <label for="date-preset">Quick range</label>
                    <select id="date-preset">
                        <option value="7" selected>Last 7 days</option>
                        <option value="1">Last 1 day</option>
                        <option value="30">Last 30 days</option>
                        <option value="0">All time</option>
                    </select>
                </div>
                <div>
                    <label for="start-date">From</label>
                    <input id="start-date" type="date">
                </div>
                <div>
                    <label for="end-date">To</label>
                    <input id="end-date" type="date">
                </div>
                <button id="refresh-btn">Refresh Map</button>
            </div>
        </div>

        <div class="section">
            <h2>Statistics</h2>
            <div id="stats" class="stats">
                Loading...
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div id="timeline-panel">
        <div class="timeline-header">
            <h2><span id="timeline-device-name">Device Timeline</span></h2>
            <button id="timeline-close">&times;</button>
        </div>
        <div class="timeline-summary" id="timeline-summary"></div>
        <div class="timeline-list" id="timeline-list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([37.7749, -122.4194], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let markers = [];
        let markersById = {};
        let polylines = [];
        let selectedDevice = null;
        let selectedLocationId = null;
        let deviceFilter = 'all';
        let currentLocations = [];

        function formatInputDate(date) {
            return date.toISOString().slice(0, 10);
        }

        const endDateInput = document.getElementById('end-date');
        const startDateInput = document.getElementById('start-date');
        const defaultEndDate = new Date();
        const defaultStartDate = new Date(defaultEndDate);
        defaultStartDate.setDate(defaultStartDate.getDate() - 7);
        startDateInput.value = formatInputDate(defaultStartDate);
        endDateInput.value = formatInputDate(defaultEndDate);

        function setDateRangeFromPreset(days) {
            if (days === 0) {
                startDateInput.value = '';
                endDateInput.value = '';
                return;
            }
            const end = new Date();
            const start = new Date(end);
            start.setDate(start.getDate() - (days - 1));
            startDateInput.value = formatInputDate(start);
            endDateInput.value = formatInputDate(end);
        }

        // Device icons
        const deviceIcons = {
            'iPhone': '📱',
            'iPad': '📱',
            'Mac': '💻',
            'MacBook': '💻',
            'Apple Watch': '⌚',
            'AirPods': '🎧',
            'default': '📍'
        };

        function getDeviceIcon(name) {
            for (const [key, icon] of Object.entries(deviceIcons)) {
                if (name.toLowerCase().includes(key.toLowerCase())) {
                    return icon;
                }
            }
            return deviceIcons.default;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString();
        }

        function formatBattery(level) {
            if (level === null || level === undefined) return '';
            const percent = Math.round(level * 100);
            const icon = percent > 50 ? '🔋' : percent > 20 ? '🪫' : '🔴';
            return `${icon} ${percent}%`;
        }

        async function loadDevices() {
            try {
                const response = await fetch('/api/devices');
                const devices = await response.json();

                const container = document.getElementById('devices-list');

                if (devices.length === 0) {
                    container.innerHTML = '<p style="color: #666;">No devices found. Start the poller to begin tracking.</p>';
                    return;
                }

                const visibleDevices = devices.filter(device => {
                    if (deviceFilter === 'active') return device.has_location;
                    if (deviceFilter === 'inactive') return !device.has_location;
                    return true;
                });

                if (selectedDevice && !visibleDevices.some(device => device.id === selectedDevice)) {
                    selectedDevice = null;
                    selectedLocationId = null;
                    hideTimelinePanel();
                }

                if (visibleDevices.length === 0) {
                    container.innerHTML = '<p style="color: #666;">No devices match this filter.</p>';
                    return;
                }

                container.innerHTML = visibleDevices.map(device => `
                    <div class="device ${selectedDevice === device.id ? 'active' : ''} ${device.has_location ? '' : 'inactive'}"
                         data-id="${device.id}">
                        <span class="device-icon">${getDeviceIcon(device.name)}</span>
                        <div class="device-info">
                            <div class="device-name">${device.name}</div>
                            <div class="device-meta">${device.device_display_name || ''}${device.has_location ? '' : ' · No location data'}</div>
                        </div>
                    </div>
                `).join('');

                // Add click handlers
                container.querySelectorAll('.device').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = el.dataset.id;
                        if (selectedDevice === id) {
                            selectedDevice = null;
                            hideTimelinePanel();
                        } else {
                            selectedDevice = id;
                        }
                        selectedLocationId = null;
                        loadDevices();
                        loadLocations();
                        loadStats();
                    });
                });
            } catch (error) {
                console.error('Failed to load devices:', error);
            }
        }

        async function loadLocations() {
            // Clear existing markers and lines
            markers.forEach(m => map.removeLayer(m));
            polylines.forEach(p => map.removeLayer(p));
            markers = [];
            markersById = {};
            polylines = [];
            currentLocations = [];

            const startDate = startDateInput.value;
            const endDate = endDateInput.value;
            let url = '/api/locations?limit=5000';

            if (startDate) {
                url += `&start=${encodeURIComponent(startDate + 'T00:00:00')}`;
            }
            if (endDate) {
                url += `&end=${encodeURIComponent(endDate + 'T23:59:59')}`;
            }

            if (selectedDevice) {
                url += `&device_id=${encodeURIComponent(selectedDevice)}`;
            }

            try {
                const response = await fetch(url);
                const locations = await response.json();

                if (locations.length === 0) {
                    hideTimelinePanel();
                    return;
                }

                // Group locations by device
                const byDevice = {};
                locations.forEach(loc => {
                    if (!byDevice[loc.device_id]) {
                        byDevice[loc.device_id] = [];
                    }
                    byDevice[loc.device_id].push(loc);
                });

                const colors = ['#00d9ff', '#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3'];
                let colorIndex = 0;
                const bounds = [];

                for (const [, deviceLocations] of Object.entries(byDevice)) {
                    const color = colors[colorIndex % colors.length];
                    colorIndex++;

                    // Sort by timestamp (oldest first for polyline)
                    deviceLocations.sort((a, b) =>
                        new Date(a.timestamp) - new Date(b.timestamp)
                    );

                    // Create polyline for path
                    const path = deviceLocations.map(loc => [loc.latitude, loc.longitude]);
                    if (path.length > 1) {
                        const polyline = L.polyline(path, {
                            color: color,
                            weight: 3,
                            opacity: 0.7
                        }).addTo(map);
                        polylines.push(polyline);
                    }

                    // Add markers
                    deviceLocations.forEach((loc, index) => {
                        const isLatest = index === deviceLocations.length - 1;
                        const marker = L.circleMarker([loc.latitude, loc.longitude], {
                            radius: isLatest ? 10 : 6,
                            fillColor: isLatest ? '#00ff88' : color,
                            color: '#fff',
                            weight: isLatest ? 3 : 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(map);

                        marker.bindPopup(`
                            <div class="popup-content">
                                <h3>${getDeviceIcon(loc.device_id)} ${loc.device_id}</h3>
                                <p><strong>Time:</strong> ${formatDate(loc.timestamp)}</p>
                                <p><strong>Position:</strong> ${loc.position_type || 'Unknown'}</p>
                                <p><strong>Accuracy:</strong> ${loc.horizontal_accuracy ? loc.horizontal_accuracy.toFixed(0) + 'm' : 'Unknown'}</p>
                                ${loc.battery_level ? `<p><strong>Battery:</strong> ${formatBattery(loc.battery_level)}</p>` : ''}
                            </div>
                        `);

                        markers.push(marker);
                        markersById[loc.id] = marker;
                        bounds.push([loc.latitude, loc.longitude]);
                    });

                    // Store for timeline if this is the selected device
                    if (selectedDevice) {
                        currentLocations = deviceLocations;
                    }
                }

                // Fit map to bounds
                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }

                // Update timeline panel if device is selected
                if (selectedDevice && currentLocations.length > 0) {
                    updateTimelinePanel();
                } else {
                    hideTimelinePanel();
                }

            } catch (error) {
                console.error('Failed to load locations:', error);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();

                document.getElementById('stats').innerHTML = `
                    <p><span>${stats.total_devices}</span> devices tracked</p>
                    <p><span>${stats.total_locations.toLocaleString()}</span> locations recorded</p>
                `;

            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        function updateTimelinePanel() {
            const panel = document.getElementById('timeline-panel');
            const deviceName = document.getElementById('timeline-device-name');
            const summary = document.getElementById('timeline-summary');
            const list = document.getElementById('timeline-list');

            // Sort locations newest first for the list
            const sortedLocations = [...currentLocations].reverse();

            // Find device name from the first location
            const firstLoc = sortedLocations[0];
            deviceName.textContent = `${getDeviceIcon(firstLoc.device_id)} Timeline`;

            summary.innerHTML = `<span>${sortedLocations.length}</span> data points in selected time range`;

            list.innerHTML = sortedLocations.map((loc, index) => {
                const isLatest = index === 0;
                const isActive = selectedLocationId === loc.id;
                const date = new Date(loc.timestamp);
                const timeStr = date.toLocaleTimeString();
                const dateStr = date.toLocaleDateString();

                let accuracyStr = '';
                if (loc.horizontal_accuracy) {
                    accuracyStr = loc.horizontal_accuracy.toFixed(0) + 'm';
                }

                return `
                    <div class="timeline-item ${isLatest ? 'latest' : ''} ${isActive ? 'active' : ''}"
                         data-id="${loc.id}"
                         data-lat="${loc.latitude}"
                         data-lng="${loc.longitude}">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <div class="timeline-time">${timeStr}</div>
                            <div class="timeline-details">
                                <span>${dateStr}</span>
                                <span>${loc.position_type || ''}</span>
                                <span>${accuracyStr}</span>
                            </div>
                        </div>
                        ${loc.battery_level ? `<div class="timeline-battery">${formatBattery(loc.battery_level)}</div>` : ''}
                    </div>
                `;
            }).join('');

            // Add click handlers to timeline items
            list.querySelectorAll('.timeline-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = parseInt(item.dataset.id);
                    const lat = parseFloat(item.dataset.lat);
                    const lng = parseFloat(item.dataset.lng);

                    // Update selection
                    selectedLocationId = id;
                    list.querySelectorAll('.timeline-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');

                    // Pan to location and open popup
                    map.setView([lat, lng], 16);
                    if (markersById[id]) {
                        markersById[id].openPopup();
                    }
                });
            });

            panel.classList.add('visible');
        }

        function hideTimelinePanel() {
            document.getElementById('timeline-panel').classList.remove('visible');
        }

        // Event listeners
        document.getElementById('refresh-btn').addEventListener('click', () => {
            loadDevices();
            loadLocations();
            loadStats();
        });

        document.getElementById('date-preset').addEventListener('change', (event) => {
            setDateRangeFromPreset(Number(event.target.value));
            loadLocations();
        });

        startDateInput.addEventListener('change', () => {
            document.getElementById('date-preset').value = '';
            loadLocations();
        });
        endDateInput.addEventListener('change', () => {
            document.getElementById('date-preset').value = '';
            loadLocations();
        });

        document.getElementById('sidebar-toggle').addEventListener('click', () => {
            const collapsed = document.body.classList.toggle('sidebar-collapsed');
            const toggle = document.getElementById('sidebar-toggle');
            toggle.setAttribute('aria-expanded', String(!collapsed));
            toggle.setAttribute('aria-label', collapsed ? 'Open sidebar' : 'Close sidebar');
            toggle.setAttribute('title', collapsed ? 'Open sidebar' : 'Close sidebar');
            setTimeout(() => map.invalidateSize(), 0);
        });

        document.getElementById('device-filter').addEventListener('change', (event) => {
            deviceFilter = event.target.value;
            loadDevices();
        });

        document.getElementById('timeline-close').addEventListener('click', () => {
            selectedDevice = null;
            selectedLocationId = null;
            hideTimelinePanel();
            loadDevices();
            loadLocations();
        });

        // Initial load
        loadDevices();
        loadLocations();
        loadStats();

        // Auto-refresh every 5 minutes
        setInterval(() => {
            loadDevices();
            loadLocations();
            loadStats();
        }, 5 * 60 * 1000);
    </script>
</body>
</html>
