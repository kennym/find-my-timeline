[project]
name = "find-my-timeline"
version = "0.2.0"
description = "Self-hosted Apple Find My location history for Unraid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyicloud>=1.0.0",
    "click>=8.0.0",
    "schedule>=1.2.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
find-my-timeline = "find_my_timeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_my_timeline"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]
